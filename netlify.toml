# Netlify build settings for Internship Nest.
#
# Netlify detects Next.js and applies its OpenNext-based Next.js adapter
# (@netlify/plugin-nextjs) automatically. It is deliberately NOT pinned here or in
# package.json: pinning opts the site out of Netlify's automatic adapter updates.
#
# Environment variables do NOT go in this file. Variables set here exist only during
# the build, never inside the server functions. Set them in the Netlify UI with scopes
# "Builds" AND "Functions": the build itself needs the Supabase ones (route modules
# create their client at import time, and NEXT_PUBLIC_* are inlined at build).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node >= 20.9. Matches the version builds were verified on locally.
  # Server functions run on the same major as the build.
  NODE_VERSION = "24"
